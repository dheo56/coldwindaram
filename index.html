<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cold Wind | 콜드윈드</title>
<style>
:root{color-scheme:dark;--bg:#0c0e13;--panel:#171b24;--panel2:#202633;--line:#303746;--text:#edf0f7;--muted:#a1aaba;--accent:#d7b66d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,"Noto Sans KR",sans-serif}
header{background:#131722;border-bottom:2px solid var(--accent)}.top{max-width:1120px;margin:auto;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{font-size:25px;font-weight:800}.brand small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
button,input,textarea{font:inherit}.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 13px;border-radius:8px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#16181e;font-weight:750}
.wrap{max-width:1120px;margin:24px auto;padding:0 22px}.hero{background:linear-gradient(120deg,#202b43,#151b29);border:1px solid #354057;padding:26px;border-radius:14px;margin-bottom:20px}
.hero h1{margin:0;font-size:28px}.hero p{color:var(--muted);margin:4px 0 16px}.search{display:flex;gap:8px}.search input{flex:1;min-width:0;background:#0d1119;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:11px}
.layout{display:grid;grid-template-columns:220px 1fr;gap:18px}.panel,.content{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.panel h3{margin:4px 0 8px;font-size:14px;color:var(--accent)}.nav button{display:block;width:100%;text-align:left;background:transparent;color:var(--text);border:0;border-radius:7px;padding:9px;cursor:pointer}.nav button:hover,.tile:hover{background:var(--panel2)}
h2{font-size:23px;margin:0 0 10px}h3{margin:0 0 8px;font-size:16px}.muted{color:var(--muted)}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:#1b202c;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:15px;text-align:left;cursor:pointer}.tile b{display:block;font-size:17px}.tile span{font-size:13px;color:var(--muted)}
.articlebox{background:#1b202b;border:1px solid var(--line);border-radius:10px;padding:15px;margin:14px 0}.articlebox p{margin:6px 0}.notice{font-size:12px;color:#d7c18b;background:#2a251c;border:1px solid #53472b;border-radius:9px;padding:11px;margin-top:18px}
table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border-bottom:1px solid var(--line);padding:9px;text-align:left}th{color:var(--accent)}
.tag{display:inline-block;border-radius:20px;background:#3a3323;color:#f0d494;padding:2px 9px;font-size:12px}
.post{display:block;width:100%;text-align:left;background:#1b202b;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:12px;margin:8px 0;cursor:pointer}.post small{display:block;color:var(--muted)}
.tierfilters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}.vote{display:flex;gap:10px;margin:12px 0}.vote button{flex:1}.comment{border-top:1px solid var(--line);padding:10px 0}
textarea,input{background:#10141c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px}textarea{width:100%;min-height:100px}
footer{max-width:1120px;margin:25px auto;padding:0 22px;color:var(--muted);font-size:12px}
.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.dialog{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);padding:22px;border-radius:13px}.dialog input,.dialog textarea{display:block;width:100%;margin:7px 0 12px}
@media(max-width:720px){.layout{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}.top{flex-wrap:wrap}.hero h1{font-size:23px}}
</style></head><body>
<header><div class="top"><div class="brand">Cold Wind<small>ARAM WIKI & COMMUNITY</small></div><div><button class="btn" onclick="openModal('login')">로그인</button> <button class="btn primary" onclick="openModal('signup')">회원가입</button></div></div></header>
<main class="wrap"><div class="hero"><h1>칼바람 나락의 모든 정보</h1><p>챔피언 · 아이템 · 증강 정보와 유저들의 이야기</p><div class="search"><input id="search" placeholder="위키 문서 검색…" onkeydown="if(event.key==='Enter')searchWiki()"><button class="btn primary" onclick="searchWiki()">검색</button></div></div>
<div class="layout"><aside class="panel"><h3>위키</h3><nav class="nav"><button onclick="home()">위키 대문</button><button onclick="category('champions')">챔피언</button><button onclick="category('items')">아이템</button><button onclick="category('augments')">증강</button></nav><h3 style="margin-top:22px">커뮤니티</h3><nav class="nav"><button onclick="board('free')">자유게시판</button><button onclick="board('best')">베스트게시판</button></nav></aside>
<section class="content" id="view"></section></div></main>
<footer>비공식 팬 프로젝트 · League of Legends 관련 권리는 각 권리자에게 있습니다.</footer>
<div class="modal" id="modal"><div class="dialog"><button class="btn" style="float:right" onclick="closeModal()">닫기</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script>
const wiki=[
{title:"아리",cat:"champions"},{title:"진",cat:"champions"},
{title:"균열 생성기",cat:"items"},{title:"증강 예시",cat:"augments",tier:"silver"}];
const labels={champions:"챔피언",items:"아이템",augments:"증강"};
// 아래 글과 수치는 게시판 구조를 보여주는 가상 예시이며 저장되지 않습니다.
const posts=[
{id:1,title:"오늘 써본 조합이 생각보다 강하네요",author:"칼바람유저",up:24,down:22,body:"게임에서 사용한 조합과 경험을 자유롭게 공유하는 예시 게시글입니다.",comments:["재미있는 조합이네요!"]},
{id:2,title:"아이템 선택 질문 있습니다",author:"초보유저",up:5,down:2,body:"자유게시판 질문 글의 예시입니다.",comments:[]},
{id:3,title:"테스트용 숨김 게시글",author:"예시계정",up:3,down:21,body:"비추천 20개 이상으로 운영자에게만 보이는 글의 예시입니다.",comments:[]}];
const view=document.getElementById("view");let currentCat="champions";let augmentTier="all";
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){view.innerHTML=`<h2>Cold Wind에 오신 것을 환영합니다</h2><p class="muted">위키 문서와 커뮤니티를 한곳에서 이용하는 사이트입니다.</p><div class="tiles"><button class="tile" onclick="category('champions')">⚔️ <b>챔피언</b><span>스킬 순서 · 아이템 · 증강</span></button><button class="tile" onclick="category('items')">🛡️ <b>아이템</b><span>기본 정보 · 환영무기 · 운명의 무기</span></button><button class="tile" onclick="category('augments')">✨ <b>증강</b><span>조합과 상호작용 정보</span></button><button class="tile" onclick="board('free')">💬 <b>커뮤니티</b><span>자유게시판 · 베스트게시판</span></button></div><div class="articlebox"><h3>작성 안내</h3><p>문서 내용과 적용 여부는 검증 후 채웁니다. 현재 표시되는 항목은 구조 예시입니다.</p></div>`}
function category(cat){currentCat=cat;if(cat==="augments"){augmentTier="all";renderAugments();return;}view.innerHTML=`<button class="btn" onclick="home()">← 대문으로</button><h2 style="margin-top:15px">${labels[cat]}</h2><div class="tiles">${wiki.filter(x=>x.cat===cat).map(x=>`<button class="tile" onclick="article('${x.title}')"><b>${esc(x.title)}</b><span>${labels[cat]} 문서</span></button>`).join("")}</div>`}
function setAugmentTier(tier){augmentTier=tier;renderAugments()}
function renderAugments(){const tiers=[['all','전체'],['silver','실버'],['gold','골드'],['prismatic','프리즘']];const filtered=wiki.filter(x=>x.cat==='augments'&&(augmentTier==='all'||x.tier===augmentTier));view.innerHTML=`<button class="btn" onclick="home()">← 대문으로</button><h2 style="margin-top:15px">증강</h2><div class="tierfilters">${tiers.map(([key,name])=>`<button class="btn ${augmentTier===key?'primary':''}" onclick="setAugmentTier('${key}')" aria-pressed="${augmentTier===key}">${name}</button>`).join('')}</div><div class="tiles">${filtered.map(x=>`<button class="tile" onclick="article('${x.title}')"><b>${esc(x.title)}</b><span>${({silver:'실버',gold:'골드',prismatic:'프리즘'})[x.tier]||'등급 미지정'} 증강</span></button>`).join('')||'<p class="muted">등록된 증강이 없습니다.</p>'}</div>`}

function section(title,body){return `<div class="articlebox"><h3>${title}</h3>${body}</div>`}
function article(title){const x=wiki.find(v=>v.title===title);if(!x)return;currentCat=x.cat;let sections="";
if(x.cat==="champions"){sections=section("스킬 순서","<p class='muted'>확인 후 작성</p>")+section("아이템","<p class='muted'>추천 아이템 정보 작성</p>")+section("증강","<p class='muted'>추천 증강 정보 작성</p>")+section("환영무기 적용 여부",`<table><tr><th>스킬</th><th>적용 여부</th></tr>${["패시브","Q","W","E","R"].map(s=>`<tr><td>${s}</td><td>미확인</td></tr>`).join("")}</table>`)}
if(x.cat==="items"){sections=section("아이템 정보","<p>기본 능력치: 확인 후 작성</p><p>고유 효과: 확인 후 작성</p>")+section("환영무기 적용 여부","<p class='muted'>미확인</p>")+section("운명의 무기 채택 시 능력치","<p>추가 능력치 및 적용 조건: 확인 후 작성</p>")}
if(x.cat==="augments"){sections=["증강 정보","주로 사용하는 챔피언","함께하면 좋은 증강","충돌하는 증강","환영무기 관련","운명의 무기 관련","아이템 관련","주의사항 및 특이사항"].map(s=>section(s,"<p class='muted'>확인 후 작성</p>")).join("")}
view.innerHTML=`<button class="btn" onclick="category('${x.cat}')">← 목록으로</button><p style="margin-top:14px"><span class="tag">문서</span></p><h2>${esc(x.title)}</h2>${sections}${section("문서 편집",`<p class="muted">회원 편집 및 변경 이력은 서버 연결 후 작동합니다.</p><button class="btn primary" onclick="openModal('edit')">문서 편집 제안</button>`)}`}
function status(p){return p.up>=20?"best":p.down>=20?"hidden":"free"}
function board(type){const visible=posts.filter(p=>type==="best"?status(p)==="best":status(p)!=="hidden");view.innerHTML=`<h2>${type==="best"?"베스트게시판":"자유게시판"}</h2><p class="muted">추천 20개 이상은 베스트. 추천 20개 이상인 글은 비추천 20개 이상이어도 베스트 유지. 그 외 비추천 20개 이상 글은 운영자만 열람 가능합니다.</p>${type==="free"?'<button class="btn primary" onclick="openModal(\'write\')">글쓰기</button>':""}<div style="margin-top:14px">${visible.map(p=>`<button class="post" onclick="post(${p.id})"><b>${esc(p.title)} ${status(p)==="best"?"⭐":""}</b><small>${esc(p.author)} · 추천 ${p.up} · 비추천 ${p.down} · 댓글 ${p.comments.length}</small></button>`).join("")||"<p>게시글이 없습니다.</p>"}</div>`}
function post(id){const p=posts.find(x=>x.id===id);if(!p||status(p)==="hidden")return;view.innerHTML=`<button class="btn" onclick="board('free')">← 게시판으로</button><h2 style="margin-top:14px">${esc(p.title)}</h2><p class="muted">${esc(p.author)}</p><div class="articlebox">${esc(p.body)}</div><div class="vote"><button class="btn" onclick="demoVote()">👍 추천 ${p.up}</button><button class="btn" onclick="demoVote()">👎 비추천 ${p.down}</button></div>${section("댓글",p.comments.map(c=>`<div class="comment">${esc(c)}</div>`).join("")||"<p class='muted'>아직 댓글이 없습니다.</p>")}<textarea placeholder="댓글을 입력하세요 (현재 저장 기능 미지원)"></textarea><button class="btn primary" onclick="demoVote()">댓글 등록</button>`}
function demoVote(){alert("현재 투표·댓글을 저장할 수 없습니다. 실제 서비스에서 계정별 1표 및 변경 기능을 구현할 예정입니다.")}
function searchWiki(){const q=document.getElementById("search").value.trim().toLowerCase();if(!q)return;const found=wiki.filter(x=>x.title.toLowerCase().includes(q));view.innerHTML=`<h2>검색 결과</h2>${found.map(x=>`<button class="post" onclick="article('${x.title}')">${esc(x.title)} · ${labels[x.cat]}</button>`).join("")||"<p>일치하는 문서가 없습니다.</p>"}`}
function openModal(type){const m=document.getElementById("modal");m.classList.add("open");document.getElementById("modalTitle").textContent=({login:"로그인",signup:"회원가입",edit:"문서 편집 제안",write:"게시글 작성"})[type];document.getElementById("modalBody").innerHTML=type==="login"?'<input placeholder="이메일"><input type="password" placeholder="비밀번호">':type==="signup"?'<input placeholder="닉네임"><input placeholder="이메일"><input type="password" placeholder="비밀번호">':type==="write"?'<input placeholder="제목"><textarea placeholder="내용"></textarea>':'<textarea placeholder="수정할 내용"></textarea>';document.getElementById("modalBody").innerHTML+='<p class="muted">현재 제출 및 저장 기능은 연결되지 않았습니다.</p>'}
function closeModal(){document.getElementById("modal").classList.remove("open")}
home();
</script></body></html>
