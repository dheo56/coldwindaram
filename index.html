<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cold Wind | 콜드윈드</title><style>
:root{color-scheme:dark;--bg:#0c0e13;--panel:#171b24;--panel2:#202633;--line:#303746;--text:#edf0f7;--muted:#a1aaba;--accent:#d7b66d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,"Noto Sans KR",sans-serif}
header{background:#131722;border-bottom:2px solid var(--accent)}.top{max-width:1120px;margin:auto;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.account{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.account-name{font-size:13px;color:var(--muted)}.brand{font-size:25px;font-weight:800}.brand small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
button,input,textarea{font:inherit}.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 13px;border-radius:8px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#16181e;font-weight:750}
.wrap{max-width:1120px;margin:24px auto;padding:0 22px}.hero{background:linear-gradient(120deg,#202b43,#151b29);border:1px solid #354057;padding:26px;border-radius:14px;margin-bottom:20px}
.hero h1{margin:0;font-size:28px}.hero p{color:var(--muted);margin:4px 0 16px}.search{display:flex;gap:8px}.search input{flex:1;min-width:0;background:#0d1119;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:11px}
.layout{display:grid;grid-template-columns:220px 1fr;gap:18px}.panel,.content{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.panel h3{margin:4px 0 8px;font-size:14px;color:var(--accent)}.nav button{display:block;width:100%;text-align:left;background:transparent;color:var(--text);border:0;border-radius:7px;padding:9px;cursor:pointer}.nav button:hover,.tile:hover{background:var(--panel2)}
h2{font-size:23px;margin:0 0 10px}h3{margin:0 0 8px;font-size:16px}.muted{color:var(--muted)}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:#1b202c;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:15px;text-align:left;cursor:pointer}.tile b{display:block;font-size:17px}.tile span{font-size:13px;color:var(--muted)}
.articlebox{background:#1b202b;border:1px solid var(--line);border-radius:10px;padding:15px;margin:14px 0}.articlebox p{margin:6px 0}.notice{font-size:12px;color:#d7c18b;background:#2a251c;border:1px solid #53472b;border-radius:9px;padding:11px;margin-top:18px}
table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border-bottom:1px solid var(--line);padding:9px;text-align:left}th{color:var(--accent)}
.tag{display:inline-block;border-radius:20px;background:#3a3323;color:#f0d494;padding:2px 9px;font-size:12px}
.post{display:block;width:100%;text-align:left;background:#1b202b;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:12px;margin:8px 0;cursor:pointer}.post small{display:block;color:var(--muted)}
.tierfilters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}.vote{display:flex;gap:10px;margin:12px 0}.vote button{flex:1}.comment{border-top:1px solid var(--line);padding:10px 0}
textarea,input{background:#10141c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px}textarea{width:100%;min-height:100px}
footer{max-width:1120px;margin:25px auto;padding:0 22px;color:var(--muted);font-size:12px}
.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.dialog{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);padding:22px;border-radius:13px}.dialog input,.dialog textarea{display:block;width:100%;margin:7px 0 12px}
@media(max-width:720px){.layout{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}.top{flex-wrap:wrap}.hero h1{font-size:23px}}

.add-form{display:grid;gap:10px;margin:14px 0}.add-form input,.add-form select{width:100%;background:#10141c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px}.add-actions{display:flex;gap:8px;flex-wrap:wrap}.add-error{color:#f1a6a6;font-size:13px}.nav button.active{background:var(--panel2);color:var(--accent);font-weight:700}.vote-grid{display:grid;grid-template-columns:minmax(90px,1fr) 1fr 1fr minmax(100px,1.3fr);gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.vote-grid:last-child{border-bottom:0}.vote-choice{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:9px;cursor:pointer}.vote-choice.chosen{background:#54452a;border-color:var(--accent);color:#ffe3a1;font-weight:800}.result{color:var(--muted);font-size:13px}.result b{color:var(--accent)}.empty{color:var(--muted);padding:20px 0}.back{margin-bottom:16px}@media(max-width:550px){.vote-grid{grid-template-columns:1fr 1fr 1fr}.vote-grid .result{grid-column:1/-1}.vote-grid{gap:6px}}
</style></head><body>
<header><div class="top"><div class="brand">Cold Wind<small>ARAM WIKI</small></div><div class="account"><span class="account-name" id="accountName"></span><button class="btn" id="authBtn" type="button">Google 로그인</button></div></div></header>
<main class="wrap"><div class="hero"><h1>칼바람 나락의 모든 정보</h1><p>챔피언 · 아이템 · 증강의 환영무기 적용 여부</p><div class="search"><input id="search" placeholder="위키 문서 검색…" aria-label="위키 문서 검색"><button class="btn primary" id="searchBtn">검색</button></div></div><div class="layout"><aside class="panel"><h3>위키</h3><nav class="nav"><button data-cat="champions">챔피언</button><button data-cat="items">아이템</button><button data-cat="augments">증강</button></nav></aside><section class="content" id="view"></section></div></main>
<footer>비공식 팬 프로젝트 · League of Legends 관련 권리는 각 권리자에게 있습니다.</footer>
<script>
'use strict';
const ADMIN_UID='ikrtP1Oe1MQ0v8guqNyoeFKptf43';
const defaults=[{title:'아리',cat:'champions'},{title:'진',cat:'champions'},{title:'카직스',cat:'champions'},{title:'균열 생성기',cat:'items'},{title:'증강 예시',cat:'augments',tier:'silver'}];
const labels={champions:'챔피언',items:'아이템',augments:'증강'};
const ENTRIES_KEY='coldwind_added_entries_v1';
let localEntries=[];try{const data=JSON.parse(localStorage.getItem(ENTRIES_KEY));if(Array.isArray(data))localEntries=data.filter(x=>x&&typeof x.title==='string'&&labels[x.cat]&&(!x.tier||['silver','gold','prismatic'].includes(x.tier)))}catch(e){}
let sharedEntries=[],entriesReady=false,adding=false,importing=false;
const view=document.getElementById('view');
let currentCat='champions',active=null,tier='all';
const sortKo=(a,b)=>a.title.localeCompare(b.title,'ko-KR');
const isAdmin=()=>!!loggedUser&&loggedUser.uid===ADMIN_UID;
function allEntries(){const map=new Map();for(const x of [...defaults,...sharedEntries])map.set(x.cat+'|'+x.title.toLocaleLowerCase('ko-KR'),x);return [...map.values()].sort(sortKo)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function category(cat){stopVotes();currentCat=cat;active=null;tier='all';adding=false;render()}
function render(){document.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('active',b.dataset.cat===currentCat));if(active){renderArticle();return}let items=allEntries().filter(x=>x.cat===currentCat&&(currentCat!=='augments'||tier==='all'||x.tier===tier));let filters=currentCat==='augments'?`<div class="tierfilters">${[['all','전체'],['silver','실버'],['gold','골드'],['prismatic','프리즘']].map(([k,v])=>`<button class="btn ${tier===k?'primary':''}" data-tier="${k}">${v}</button>`).join('')}</div>`:'';
let form=adding&&isAdmin()?`<form class="articlebox add-form" id="addForm"><h3>${labels[currentCat]} 추가</h3><input name="title" maxlength="70" required autocomplete="off" placeholder="${labels[currentCat]} 이름" aria-label="${labels[currentCat]} 이름">${currentCat==='augments'?'<select name="tier" aria-label="증강 등급"><option value="silver">실버</option><option value="gold">골드</option><option value="prismatic">프리즘</option></select>':''}<div class="add-error" id="addError" role="alert"></div><div class="add-actions"><button class="btn primary" type="submit">저장</button><button class="btn" type="button" id="cancelAdd">취소</button></div></form>`:'';
view.innerHTML=`<h2>${labels[currentCat]}</h2>${isAdmin()?`<button class="btn primary" id="startAdd">+ ${labels[currentCat]} 추가</button>`:''}${form}${filters}<div class="tiles">${items.map(x=>`<button class="tile" data-open="${esc(x.title)}"><b>${esc(x.title)}</b><span>환영무기 적용 여부</span></button>`).join('')}</div>`;}
async function addEntry(form){if(!isAdmin()||!window.coldwindDB)return;const title=form.elements.title.value.trim();const err=document.getElementById('addError');if(!title){err.textContent='이름을 입력해 주세요.';return}if(allEntries().some(x=>x.cat===currentCat&&x.title.toLocaleLowerCase('ko-KR')===title.toLocaleLowerCase('ko-KR'))){err.textContent='이미 등록된 이름입니다.';return}const entry={title,cat:currentCat};if(currentCat==='augments')entry.tier=form.elements.tier.value;const btn=form.querySelector('[type=submit]');btn.disabled=true;try{await window.coldwindDB.saveEntry(entry.cat,dbItemId(entry.title),entry);adding=false;render()}catch(e){console.error(e);err.textContent='저장하지 못했습니다. 데이터베이스 규칙을 확인해 주세요.';btn.disabled=false}}
async function importLocalEntries(){if(importing||!isAdmin()||!entriesReady||!window.coldwindDB||!localEntries.length)return;importing=true;const candidates=localEntries.filter(x=>!allEntries().some(y=>y.cat===x.cat&&y.title.toLocaleLowerCase('ko-KR')===x.title.toLocaleLowerCase('ko-KR')));for(const entry of candidates){try{await window.coldwindDB.saveEntry(entry.cat,dbItemId(entry.title),entry)}catch(e){console.error('기존 항목 이전 실패',e);importing=false;return}}localEntries=[];localStorage.removeItem(ENTRIES_KEY);importing=false}
// Realtime Database paths: votes/{category}/{encoded title}/{uid}
function dbItemId(title){const bytes=new TextEncoder().encode(title);let binary='';for(const b of bytes)binary+=String.fromCharCode(b);return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function voteKey(x,skill){return x.cat+'|'+x.title+'|'+skill}
function votePath(x,skill){return 'votes/'+x.cat+'/'+dbItemId((x.voteTitle||x.title)+'|'+skill)}
let remoteVotes={},voteUnsubs=[],viewToken=0,loggedUser=null,authReady=false;
function stopVotes(){for(const unsub of voteUnsubs)unsub();voteUnsubs=[];remoteVotes={};viewToken++}
function row(x,skill){let key=voteKey(x,skill),ballots=remoteVotes[skill]||{},mine=loggedUser?ballots[loggedUser.uid]:null;
const values=Object.values(ballots),o=values.filter(v=>v==='O').length,n=values.filter(v=>v==='X').length,total=o+n;
return `<div class="vote-grid"><b>${esc(skill)}</b><button class="vote-choice ${mine==='O'?'chosen':''}" data-vote="O" data-skill="${esc(skill)}" aria-pressed="${mine==='O'}" ${!loggedUser?'disabled title="로그인 후 투표 가능"':''}>O</button><button class="vote-choice ${mine==='X'?'chosen':''}" data-vote="X" data-skill="${esc(skill)}" aria-pressed="${mine==='X'}" ${!loggedUser?'disabled title="로그인 후 투표 가능"':''}>X</button><span class="result">O <b>${o}</b> · X <b>${n}</b>${mine?` · 내 선택 <b>${mine}</b>`:''}</span></div>`}
function renderArticle(){let x=active;if(!x)return;let skills=x.cat==='champions'?['패시브','Q','W','E','R']:['적용 여부'];view.innerHTML=`<button class="btn back" id="back">← ${labels[x.cat]} 목록</button><h2>${esc(x.title)}</h2>${isAdmin()&&x._id?`<div class="add-actions" style="margin:10px 0 16px"><button class="btn" id="editEntry">이름 수정</button><button class="btn" id="deleteEntry">삭제</button></div>`:''}<div class="articlebox"><h3>환영무기 적용 여부</h3>${skills.map(s=>row(x,s)).join('')}</div>`}
async function editEntry(){
 if(!isAdmin()||!active?._id||!window.coldwindDB)return;
 const x=active;const proposed=prompt('새 이름을 입력해 주세요.',x.title);
 if(proposed===null)return;const title=proposed.trim();
 if(!title||title.length>70){alert('이름은 1~70자로 입력해 주세요.');return}
 if(title===x.title)return;
 if(allEntries().some(y=>y.cat===x.cat&&y.title.toLocaleLowerCase('ko-KR')===title.toLocaleLowerCase('ko-KR')&&y._id!==x._id)){alert('이미 등록된 이름입니다.');return}
 try{const updated={title,cat:x.cat,voteTitle:x.voteTitle||x.title};if(x.cat==='augments')updated.tier=x.tier;await window.coldwindDB.saveEntry(x.cat,x._id,updated);active={...updated,_id:x._id};article()}
 catch(err){console.error(err);alert('이름을 수정하지 못했습니다.')}
}
async function deleteEntry(){
 if(!isAdmin()||!active?._id||!window.coldwindDB)return;
 const x=active;if(!confirm('"'+x.title+'" 항목을 삭제할까요?'))return;
 try{await window.coldwindDB.saveEntry(x.cat,x._id,null);category(x.cat)}
 catch(err){console.error(err);alert('삭제하지 못했습니다.')}
}
function article(){stopVotes();if(!active)return;renderArticle();if(!window.coldwindDB)return;const token=viewToken;const x=active;const skills=x.cat==='champions'?['패시브','Q','W','E','R']:['적용 여부'];for(const skill of skills){const unsubscribe=window.coldwindDB.watch(votePath(x,skill),data=>{if(token!==viewToken)return;remoteVotes[skill]=data&&typeof data==='object'?data:{};renderArticle()},err=>{if(token===viewToken)console.error('투표 읽기 실패',err)});voteUnsubs.push(unsubscribe)}}
async function castVote(skill,choice){if(!loggedUser||!active||!window.coldwindDB)return;const x=active;const current=(remoteVotes[skill]||{})[loggedUser.uid]||null;try{await window.coldwindDB.setVote(votePath(x,skill)+'/'+loggedUser.uid,current===choice?null:choice)}catch(err){console.error(err);alert('투표 저장에 실패했습니다. 잠시 후 다시 시도해 주세요.')}}
function searchWiki(){stopVotes();let q=document.getElementById('search').value.trim().toLowerCase();if(!q){category(currentCat);return}active=null;document.querySelectorAll('[data-cat]').forEach(b=>b.classList.remove('active'));let found=allEntries().filter(x=>x.title.toLowerCase().includes(q));view.innerHTML=`<h2>검색 결과</h2><div class="tiles">${found.map(x=>`<button class="tile" data-search-open="${esc(x.cat)}|${esc(x.title)}"><b>${esc(x.title)}</b><span>${labels[x.cat]}</span></button>`).join('')}</div>${found.length?'':'<p class="empty">검색 결과가 없습니다.</p>'}`}
document.addEventListener('submit',e=>{if(e.target.id==='addForm'){e.preventDefault();addEntry(e.target)}});
document.addEventListener('click',e=>{if(e.target.closest('#startAdd')&&isAdmin()){adding=true;render();document.querySelector('#addForm input')?.focus();return}if(e.target.closest('#cancelAdd')){adding=false;render();return}let c=e.target.closest('[data-cat]');if(c){category(c.dataset.cat);return}let t=e.target.closest('[data-tier]');if(t){tier=t.dataset.tier;render();return}let o=e.target.closest('[data-open]');if(o){active=allEntries().find(x=>x.cat===currentCat&&x.title===o.dataset.open);article();return}let so=e.target.closest('[data-search-open]');if(so){let [cat,title]=so.dataset.searchOpen.split('|');currentCat=cat;active=allEntries().find(x=>x.cat===cat&&x.title===title);article();return}if(e.target.closest('#back')){category(currentCat);return}if(e.target.closest('#editEntry')){editEntry();return}if(e.target.closest('#deleteEntry')){deleteEntry();return}let v=e.target.closest('[data-vote]');if(v){castVote(v.dataset.skill,v.dataset.vote);return}});
document.getElementById('authBtn').addEventListener('click',async()=>{if(!window.coldwindDB)return;try{if(loggedUser)await window.coldwindDB.logout();else await window.coldwindDB.login()}catch(e){console.error(e);alert('로그인 처리에 실패했습니다. 팝업 차단 여부를 확인해 주세요.')}});
document.getElementById('searchBtn').addEventListener('click',searchWiki);document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')searchWiki()});render();
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getDatabase,ref,onValue,set} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
const firebaseConfig={
 apiKey:'AIzaSyCCD0gCMP69gNAeHw4vtZFkbcs4PgMA8Cc',
 authDomain:'coldwindaram.firebaseapp.com',
 databaseURL:'https://coldwindaram-default-rtdb.asia-southeast1.firebasedatabase.app',
 projectId:'coldwindaram',
 storageBucket:'coldwindaram.firebasestorage.app',
 messagingSenderId:'296443356015',
 appId:'1:296443356015:web:95b8623978cdfa93f7fe9a',
 measurementId:'G-EX9BV69RZR'
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),provider=new GoogleAuthProvider();
window.coldwindDB={
 login:()=>signInWithPopup(auth,provider),logout:()=>signOut(auth),
 watch:(path,cb,err)=>onValue(ref(db,path),snap=>cb(snap.val()),err),
 setVote:(path,value)=>set(ref(db,path),value),
 saveEntry:(cat,id,value)=>set(ref(db,'entries/'+cat+'/'+id),value)
};
onAuthStateChanged(auth,user=>{loggedUser=user;authReady=true;document.getElementById('accountName').textContent=user?(user.displayName||user.email||'로그인됨'):'';document.getElementById('authBtn').textContent=user?'로그아웃':'Google 로그인';if(active)renderArticle();else render();importLocalEntries()});
window.coldwindDB.watch('entries',data=>{sharedEntries=[];if(data&&typeof data==='object')for(const [cat,records] of Object.entries(data)){if(!labels[cat]||!records||typeof records!=='object')continue;for(const [id,value] of Object.entries(records)){if(value&&value.cat===cat&&typeof value.title==='string')sharedEntries.push({...value,_id:id})}}entriesReady=true;if(!active)render();importLocalEntries()},err=>console.error('항목 목록 읽기 실패',err));
if(active)article();
</script></body></html>
